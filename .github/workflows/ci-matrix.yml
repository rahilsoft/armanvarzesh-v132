
name: CI Matrix
on: [push, pull_request]
jobs:
  node-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [activities-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # REV-20261021-04: no `|| true`. Build and test only this service (and the
      # workspace packages it depends on) so a failure turns the job red. The
      # old `pnpm -w run build` built the whole monorepo and its failure was
      # swallowed, so this check proved nothing.
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Build (service and its workspace dependencies)
        run: pnpm --filter "@arman/${{ matrix.service }}..." run --if-present build
      - name: Test
        run: pnpm run test
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload contracts
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: contracts/
