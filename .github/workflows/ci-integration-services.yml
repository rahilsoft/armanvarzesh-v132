name: CI Integration Services

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/armanfitsvc?schema=public
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: armanfit-ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: armanfit_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be set up BEFORE setup-node, otherwise `cache: 'pnpm'` runs
      # while pnpm is not yet on PATH ("Unable to locate executable file: pnpm").
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && { echo "Postgres is ready"; exit 0; }
            sleep 2
          done
          echo "::error::Postgres not ready after 60 s"; exit 1

      - name: Wait for Redis
        run: |
          for i in {1..30}; do
            (echo PING | nc -w 1 localhost 6379 | grep -q PONG) && { echo "Redis is ready"; exit 0; }
            sleep 2
          done
          echo "::error::Redis not ready after 60 s"; exit 1

      # GitHub service containers cannot pass a command, so `minio server /data` never
      # started and the job died in "Initialize containers". Start it as a step instead.
      # Docker Hub `minio/minio` now answers "pull access denied" (run 40645101335),
      # the same release is pulled from MinIO's own registry on quay.io.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z server /data --console-address ":9001"

      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && { echo "MinIO is ready"; exit 0; }
            sleep 2
          done
          docker logs minio || true
          echo "::error::MinIO not ready after 60 s"; exit 1

      - name: Prisma generate (all services)
        run: |
          for d in services/* app/* packages/*; do
            if [ -f "$d/prisma/schema.prisma" ]; then
              echo "Generating Prisma client in $d"
              (cd "$d" && npx prisma generate)
            fi
          done

      - name: Prisma migrate (deploy or push)
        run: |
          for d in services/* app/* packages/*; do
            if [ -f "$d/prisma/schema.prisma" ]; then
              echo "Applying migrations in $d"
              (cd "$d" && (npx prisma migrate deploy || npx prisma db push --skip-generate))
            fi
          done

      - name: Seed all (optional)
        run: pnpm db:seed:all || true

      # Backend unit and e2e tests are not run here: they ran with `|| true`, so
      # they could never fail this job. backend-e2e.yml runs them for real
      # (real PostgreSQL + Redis, non-zero exit fails, 0 executed tests fails).
