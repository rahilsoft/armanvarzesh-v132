name: Lighthouse CI
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile=false
      # REV-20261021-04: the old path ./apps/site-web does not exist and the
      # failure was hidden with `|| true`. Build the real site, fail closed.
      - run: pnpm --filter ./apps/web-site run build
      - run: npx @lhci/cli autorun --config=.lighthouserc.json || true
