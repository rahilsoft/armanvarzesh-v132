name: backend-e2e

# Backend unit + e2e tests against a real PostgreSQL 16 and Redis 7.
# No test double replaces the database or the cache here.

# No paths filter on purpose: a PR that only touches workflows, the lockfile or
# .claude/hooks must still run the gate, and a required check must never stay pending.
on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arman
          POSTGRES_PASSWORD: arman_ci_only
          POSTGRES_DB: arman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arman -d arman_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://arman:arman_ci_only@localhost:5432/arman_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field of the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate test-only secrets
        run: |
          # Random per run, at least 32 chars, never committed.
          for name in JWT_SECRET REFRESH_JWT_SECRET PAYMENT_WEBHOOK_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Prisma generate
        run: pnpm --filter ./app/backend exec prisma generate --schema src/database/prisma/schema.prisma

      - name: Apply schema to the test database
        run: pnpm --filter ./app/backend exec prisma migrate deploy --schema src/database/prisma/schema.prisma
        # Note: if migrate deploy ever stops being viable, `prisma db push --skip-generate`
        # may be used ONLY against this throwaway CI database. ROADMAP 0.5 owns the
        # migration baseline and will replace any such fallback.

      - name: Lint
        run: pnpm --filter ./app/backend exec eslint .

      - name: Typecheck
        run: pnpm --filter ./app/backend typecheck

      - name: Typecheck e2e specs
        run: pnpm --filter ./app/backend exec tsc -p test/tsconfig.e2e.json

      - name: Unit tests
        timeout-minutes: 8
        run: pnpm --filter ./app/backend exec jest src test/unit --forceExit --json --outputFile=$RUNNER_TEMP/unit-results.json

      - name: E2E tests (real PostgreSQL + Redis)
        # Hard cap so a hang fails fast instead of burning the runner. Jest must exit on its
        # own: services close their Redis/BullMQ connections on shutdown, so --forceExit is
        # deliberately not used here (it would hide a leaked handle). Arguments go to jest
        # directly via `exec`: after `pnpm run x -- args` they reached jest as path patterns.
        timeout-minutes: 12
        run: pnpm --filter ./app/backend exec jest test/e2e --runInBand --testTimeout=60000 --reporters=default --reporters=github-actions --json --outputFile=$RUNNER_TEMP/e2e-results.json

      - name: Fail when no test executed
        # Zero executed tests is not a pass: a moved test folder, a wrong
        # pattern or a blanket skip would otherwise turn this job green.
        run: |
          for kind in unit e2e; do
            f="$RUNNER_TEMP/$kind-results.json"
            ran=$(jq '.numTotalTests - .numPendingTests - (.numTodoTests // 0)' "$f")
            echo "$kind: $ran executed"
            if [ "${ran:-0}" -le 0 ]; then echo "::error title=$kind::0 tests executed"; exit 1; fi
          done

      - name: Publish test counts as annotations
        # Read-only summary so the pass/fail/skip counts are visible from the
        # check-run API. It never changes the job result: the test steps above
        # keep their own exit codes.
        if: always()
        run: |
          for kind in unit e2e; do
            f="$RUNNER_TEMP/$kind-results.json"
            if [ -f "$f" ]; then
              echo "::notice title=$kind counts::$(jq -r '"suites passed=\(.numPassedTestSuites) failed=\(.numFailedTestSuites) pending=\(.numPendingTestSuites), tests passed=\(.numPassedTests) failed=\(.numFailedTests) skipped=\(.numPendingTests) todo=\(.numTodoTests) total=\(.numTotalTests)"' "$f")"
            else
              echo "::notice title=$kind counts::no results file (step did not run or crashed)"
            fi
          done

  claude-hooks:
    # Tests of the Claude Code hooks (.claude/hooks): guard, post-edit check, stop gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Hook tests
        run: |
          set -o pipefail
          node --test --test-reporter=tap .claude/hooks/tests/*.test.mjs | tee "$RUNNER_TEMP/hooks.tap"
          tests=$(sed -n 's/^# tests //p' "$RUNNER_TEMP/hooks.tap")
          echo "::notice title=hook tests::$(grep -E '^# (tests|pass|fail|skipped)' "$RUNNER_TEMP/hooks.tap" | tr '\n' ' ')"
          [ "${tests:-0}" -gt 0 ] || { echo "::error::0 hook tests executed"; exit 1; }
